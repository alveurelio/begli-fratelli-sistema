<!DOCTYPE html>
<html lang="es">
<head>
<!--
  ============================================================
  BEGLI FRATELLI'S — SISTEMA POS + COCINA + QR
  Archivo: index.html — PANTALLA PRINCIPAL / MENÚ DE ACCESO
  ------------------------------------------------------------
  Este archivo es la PUERTA DE ENTRADA del sistema.
  Solo contiene botones para abrir cada módulo.
  NO es la pantalla de caja. La caja está en: caja.html
  NO tiene conexión con Firebase.
  ============================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Begli Fratelli's — Sistema</title>

<style>
/* ============================================================
   VARIABLES Y RESET
   ============================================================ */
:root {
  --rojo:    #c41e3a;
  --verde:   #2d8659;
  --fondo:   #f4f4f4;
  --blanco:  #ffffff;
  --texto:   #1a1a1a;
  --texto2:  #666666;
  --borde:   #e0e0e0;
  --sombra:  0 2px 12px rgba(0,0,0,0.08);
  --radio:   14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--fondo);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--texto);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ============================================================
   ENCABEZADO
   ============================================================ */
.encabezado {
  text-align: center;
  margin-bottom: 36px;
}

.encabezado-logo {
  font-size: 48px;
  display: block;
  margin-bottom: 10px;
}

.encabezado-nombre {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--texto);
}

.encabezado-sub {
  font-size: 13px;
  color: var(--texto2);
  margin-top: 4px;
  letter-spacing: 0.3px;
}

/* ============================================================
   GRILLA DE TARJETAS
   ============================================================ */
.grilla {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  width: 100%;
  max-width: 520px;
}

/* En celulares muy pequeños: una columna */
@media (max-width: 360px) {
  .grilla { grid-template-columns: 1fr; }
}

/* ============================================================
   TARJETA DE MÓDULO
   ============================================================ */
.tarjeta {
  background: var(--blanco);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  box-shadow: var(--sombra);
  transition: box-shadow 0.2s, transform 0.15s;
}

.tarjeta:hover {
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  transform: translateY(-2px);
}

/* Tarjeta deshabilitada (módulo no disponible aún) */
.tarjeta.deshabilitada {
  opacity: 0.55;
  pointer-events: none;
}

.tarjeta-icono {
  font-size: 28px;
  line-height: 1;
}

.tarjeta-titulo {
  font-size: 15px;
  font-weight: 700;
  color: var(--texto);
}

.tarjeta-desc {
  font-size: 12px;
  color: var(--texto2);
  line-height: 1.4;
  flex: 1;
}

/* ============================================================
   BOTONES
   ============================================================ */
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
  width: 100%;
  text-align: center;
}

.btn:hover { opacity: 0.88; }

/* Verde para cliente */
.btn-cliente  { background: var(--verde); color: #fff; }

/* Rojo para caja */
.btn-caja     { background: var(--rojo);  color: #fff; }

/* Gris oscuro para los demás */
.btn-neutro   { background: #3a3a3a;       color: #fff; }

/* Botón deshabilitado */
.btn-disabled {
  background: #cccccc;
  color: #888888;
  cursor: not-allowed;
  opacity: 1;
}

/* ============================================================
   PIE DE PÁGINA
   ============================================================ */
.pie {
  margin-top: 40px;
  font-size: 11px;
  color: #aaa;
  text-align: center;
  line-height: 1.6;
}
</style>
</head>
<body>

<!-- ENCABEZADO DEL SISTEMA -->
<div class="encabezado">
  <span class="encabezado-logo">🍕</span>
  <div class="encabezado-nombre">BEGLI FRATELLI'S</div>
  <div class="encabezado-sub">Sistema POS + Cocina + QR</div>
</div>

<!-- GRILLA DE MÓDULOS -->
<div class="grilla">

  <!-- MÓDULO: CLIENTE -->
  <div class="tarjeta">
    <span class="tarjeta-icono">👤</span>
    <div class="tarjeta-titulo">Cliente</div>
    <div class="tarjeta-desc">Realizar pedido desde la mesa</div>
    <a class="btn btn-cliente" href="cliente_firebase.html?mesa=1">
      Abrir Cliente
    </a>
  </div>

  <!-- MÓDULO: CAJA -->
  <div class="tarjeta">
    <span class="tarjeta-icono">💰</span>
    <div class="tarjeta-titulo">Caja</div>
    <div class="tarjeta-desc">Administrar pedidos</div>
    <a class="btn btn-caja" href="caja.html">
      Abrir Caja
    </a>
  </div>

  <!-- MÓDULO: COCINA — próximamente -->
  <div class="tarjeta deshabilitada">
    <span class="tarjeta-icono">👨‍🍳</span>
    <div class="tarjeta-titulo">Cocina</div>
    <div class="tarjeta-desc">Visualizar pedidos en tiempo real</div>
    <button class="btn btn-disabled" disabled>
      Próximamente
    </button>
  </div>

  <!-- MÓDULO: QR — próximamente -->
  <div class="tarjeta deshabilitada">
    <span class="tarjeta-icono">📱</span>
    <div class="tarjeta-titulo">QR Mesas</div>
    <div class="tarjeta-desc">Generar códigos QR por mesa</div>
    <button class="btn btn-disabled" disabled>
      Próximamente
    </button>
  </div>

</div>

<!-- PIE -->
<div class="pie">
  Begli Fratelli's · Naranjal, Guayas, Ecuador<br>
  Sistema POS · Demo v1.0
</div>

</body>
</html>
